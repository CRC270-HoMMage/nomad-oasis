services:
  # the search engine
  elastic:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: nomad_oasis_elastic
    security_opt:
      - no-new-privileges:true
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://elastic:9200/_cat/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # the user data db
  mongo:
    restart: unless-stopped
    image: docker.io/mongo:8.0
    container_name: nomad_oasis_mongo
    security_opt:
      - no-new-privileges:true
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongo:/data/db
      - ./.volumes/mongo:/backup
    command: mongod --logpath=/dev/null # --quiet
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "mongo:27017/test"
        - "--quiet"
        - "--eval"
        - "'db.runCommand({ping:1}).ok'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  postgresql:
    restart: unless-stopped
    container_name: nomad_oasis_postgresql
    security_opt:
      - no-new-privileges:true
    environment:
      # Password is interpolated from .env (POSTGRES_PASSWORD). Defaults to "temporal"
      # so existing deployments keep working. NOTE: postgres only applies this on FIRST
      # init of an empty data volume. Rotating on a RUNNING deployment also needs an
      # `ALTER USER temporal WITH PASSWORD ...` inside the DB -- changing this value
      # alone just breaks temporal's login. Full recipe in scripts/generate-env.sh.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_USER: temporal
    image: docker.io/postgres:16
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-setup-db:
    image: temporalio/admin-tools:1.31
    container_name: temporal-setup-db
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgresql
      - SQL_PASSWORD=${POSTGRES_PASSWORD:-temporal}
    volumes:
      - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
    entrypoint: ["/bin/sh", "/scripts/_setup_temporal.sh"]
    command: ["setup_db"]

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    volumes:
      - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
    entrypoint: ["/bin/sh", "/scripts/_setup_temporal.sh"]
    command: ["create_namespace"]

  temporal:
    restart: unless-stopped
    image: temporalio/server:1.31
    container_name: nomad_oasis_temporal
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-setup-db:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgresql
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./configs/_temporal-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # nomad worker (processing)
  worker:
    restart: unless-stopped
    image: ghcr.io/crc270-hommage/nomad-oasis:main
    platform: linux/amd64
    security_opt:
      - no-new-privileges:true
    environment:
      NOMAD_SERVICE: nomad_oasis_worker
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_LOGSTASH_HOST: logtransfer
      NOMAD_TEMPORAL_HOST: temporal
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml:ro
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run action-internal-worker
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8080/health"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "4.0" # Maximum 4 CPU cores
          memory: 8G # Maximum 8GB RAM

  # nomad gpu worker (actions)
  # gpu_worker:
  #   restart: unless-stopped
  #   image: ghcr.io/crc270-hommage/nomad-oasis/gpu-action:main
  #   platform: linux/amd64
  #   container_name: nomad_oasis_gpu_worker
  #   env_file:
  #     - ./.env
  #   deploy:
  #     replicas: 1
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all # Use all available GPUs
  #             capabilities: [gpu]
  #   environment:
  #     NOMAD_SERVICE: nomad_oasis_gpu_worker
  #     NOMAD_ELASTIC_HOST: elastic
  #     NOMAD_MONGO_HOST: mongo
  #     NOMAD_LOGSTASH_HOST: logtransfer
  #     NOMAD_TEMPORAL_HOST: temporal
  #   depends_on:
  #     elastic:
  #       condition: service_healthy
  #     mongo:
  #       condition: service_healthy
  #     temporal:
  #       condition: service_healthy
  #   volumes:
  #     # - ./configs/nomad.yaml:/app/nomad.yaml
  #     - ./.volumes/fs:/app/.volumes/fs
  #   command: python -m nomad.cli admin run action-gpu-worker
  #   healthcheck:
  #     test:
  #       - "CMD"
  #       - "curl"
  #       - "--fail"
  #       - "--silent"
  #       - "http://localhost:8080/health"
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s

  # # nomad cpu worker (actions)
  # cpu_worker:
  #   restart: unless-stopped
  #   image: ghcr.io/crc270-hommage/nomad-oasis/cpu-action:main
  #   platform: linux/amd64
  #   container_name: nomad_oasis_cpu_worker
  #   env_file:
  #     - ./.env
  #   environment:
  #     NOMAD_SERVICE: nomad_oasis_cpu_worker
  #     NOMAD_ELASTIC_HOST: elastic
  #     NOMAD_MONGO_HOST: mongo
  #     NOMAD_LOGSTASH_HOST: logtransfer
  #     NOMAD_TEMPORAL_HOST: temporal
  #   deploy:
  #     replicas: 1
  #     resources:
  #       limits:
  #         cpus: "2.0" # Maximum 2 CPU cores
  #         memory: 8G # Maximum 8GB RAM
  #   depends_on:
  #     elastic:
  #       condition: service_healthy
  #     mongo:
  #       condition: service_healthy
  #     temporal:
  #       condition: service_healthy
  #   volumes:
  #     # - ./configs/nomad.yaml:/app/nomad.yaml
  #     - ./.volumes/fs:/app/.volumes/fs
  #   command: python -m nomad.cli admin run action-cpu-worker
  #   healthcheck:
  #     test:
  #       - "CMD"
  #       - "curl"
  #       - "--fail"
  #       - "--silent"
  #       - "http://localhost:8080/health"
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s

  # nomad app (api + proxy)
  app:
    restart: unless-stopped
    image: ghcr.io/crc270-hommage/nomad-oasis:main
    platform: linux/amd64
    container_name: nomad_oasis_app
    security_opt:
      - no-new-privileges:true
    environment:
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 80
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_LOGSTASH_HOST: logtransfer
      # NORTH runs on the GPU host (.102) and is reached over WireGuard. This is where the
      # app builds its app->hub URL from: http://{hub_host}:{hub_port}{api_base_path}/north/hub.
      NOMAD_NORTH_HUB_HOST: 10.10.0.2
      NOMAD_TEMPORAL_HOST: temporal
    env_file:
      - ./.env
    # GPU-NORTH Phase 3: publish the app API to the WireGuard peer, so a hub running on the
    # GPU host can reach it at http://10.10.0.1:8000/nomad-oasis/api/v1. Bound to a single IP
    # -- NEVER 0.0.0.0, which would expose an unauthenticated-by-default API to the campus.
    #
    # Defaults to loopback so any host without wg0 still starts normally; samarium sets
    # NOMAD_APP_WG_BIND=10.10.0.1 in .env. Keeping the publish here (rather than as a local
    # edit on the server) is deliberate -- it was lost once already, on 2026-08-05, when
    # samarium's uncommitted docker-compose.yaml edits were discarded before a pull.
    #
    # ⚠️ Publishing a port and permitting a port are separate acts. samarium runs
    # `default deny (incoming)`, so this also needs:
    #     sudo ufw allow in on wg0 from 10.10.0.2 to any port 8000 proto tcp
    # `ss -tlnp` confirms only the bind, not reachability, so a missing rule looks like a
    # broken tunnel. Verify from the GPU host with a real request to /nomad-oasis/alive.
    #
    # ⚠️ If wg0 is down when Docker starts this container the bind fails with "cannot assign
    # requested address". `restart: unless-stopped` retries until the tunnel is up.
    ports:
      - "${NOMAD_APP_WG_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      temporal:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml:ro
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run app --with-gui --gunicorn --host 0.0.0.0 --workers 2
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8000/-/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # nomad logtransfer
  # to enable the logtransfer service run "docker compose --profile with_logtransfer up"
  logtransfer:
    restart: unless-stopped
    image: ghcr.io/crc270-hommage/nomad-oasis:main
    security_opt:
      - no-new-privileges:true
    environment:
      NOMAD_SERVICE: nomad_oasis_logtransfer
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
    env_file:
      - ./.env
    depends_on:
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml:ro
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run logtransfer
    profiles: ["with_logtransfer"]

  # nomad proxy (a reverse proxy for nomad)
  proxy:
    restart: unless-stopped
    image: docker.io/nginx:1.31.1-alpine
    container_name: nomad_oasis_proxy
    security_opt:
      - no-new-privileges:true
    command: nginx -g 'daemon off;'
    volumes:
      # Shared config
      - ./configs/nginx_base_conf:/etc/nginx/conf.d/nginx_base_conf:ro
      # HTTP
      # - ./configs/nginx_http.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS (you need to have a TLS certificate)
      - ./configs/nginx_https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/selfsigned.crt:/etc/nginx/tls/nomad-oasis.crt:ro  # Path to your TLS certificate
      - ./tls/selfsigned.key:/etc/nginx/tls/nomad-oasis.key:ro  # Path to your TLS private key
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started # TODO: service_healthy
    ports:
      - 80:80
      - 443:443

volumes:
  mongo:
    name: "nomad_oasis_mongo"
  elastic:
    name: "nomad_oasis_elastic"
  keycloak:
    name: "nomad_oasis_keycloak"
  postgresql:
    name: "nomad_oasis_postgresql"


networks:
  default:
    name: nomad_oasis_network
