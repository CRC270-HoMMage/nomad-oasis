[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==1.4.3", 
  "nomad-gui==2.0.0b1",
]

[project.urls]
repository = "https://github.com/crc270-hommage/nomad-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-north-jupyter>=0.2.6",
  "nomad-measurements @ git+https://github.com/CRC270-HoMMage/nomad-measurements.git@b57bdd183445e7f7fb63729bf4c68070b136c11d",
  # nomad-sfb270-eln was absorbed into nomad-mpms at 897b3c8. Its schema package now
  # ships from there, so the separate pin is gone. Bump these two together only —
  # dropping the eln pin against an older nomad-mpms would remove data.specimen.*
  # and break the magnetic-measurements app.
  "nomad-mpms @ git+https://github.com/CRC270-HoMMage/nomad-mpms.git@897b3c83fa5d8f7fc9904e0d224c3018eba8ced0#subdirectory=nomad-mpms",
]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==1.4.3"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
