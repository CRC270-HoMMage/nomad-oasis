# Nginx configuration for handling HTTP requests

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen        80;
    server_name   localhost;
    # Forwarded-client headers, set ONCE here for every location in nginx_base_conf.
    # nginx replaces rather than merges inherited proxy_set_header sets, so a single
    # proxy_set_header inside a location would discard all of these plus the Connection ""
    # below -- which is why these live at server level and not per-location.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
