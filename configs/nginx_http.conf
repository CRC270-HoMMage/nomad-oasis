# Nginx configuration for handling HTTP requests

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen        80;
    server_name   localhost;
    # Forwarded-client headers and Connection "" for keep-alive, inherited by every location in
    # nginx_base_conf. Kept in one snippet because the locations that must set a header of their
    # own include it too -- nginx replaces rather than merges inherited proxy_set_header sets.
    include conf.d/nginx_proxy_headers_conf;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;

    include conf.d/nginx_base_conf;
}
