# Nginx configuration for handling HTTPS requests
# - Redirects all HTTP traffic to HTTPS
# - Uses a self-signed SSL certificate

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect all to HTTPS
server {
    listen 80;
    server_name samarium.trr270.tu-darmstadt.de;

    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name samarium.trr270.tu-darmstadt.de;

    # TLS certificate configuration
    ssl_certificate     /etc/nginx/tls/nomad-oasis.crt;
    ssl_certificate_key /etc/nginx/tls/nomad-oasis.key;

    # --- TLS hardening (Mozilla "intermediate") ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NomadSSL:10m;
    ssl_session_tickets off;

    # --- Security headers ---
    # HSTS: DISABLED while this host serves a SELF-SIGNED certificate (issuer==subject
    # for CN=samarium.trr270.tu-darmstadt.de, observed 2026-06-30). With an untrusted
    # cert browsers ignore this header anyway, and it becomes a lockout footgun if the
    # cert is ever manually trusted. Re-enable the line below ONLY once a browser-trusted
    # cert (DFN-PKI / Let's Encrypt) is installed at tls/nomad-oasis.{crt,key}.
    # Add ;preload only after you commit to keeping HTTPS up for this domain permanently.
    # add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $host;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
