services:
  api_host: "samarium.trr270.tu-darmstadt.de"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

auth:
  # Fully private Oasis. Every API request requires a valid login via the central
  # NOMAD Keycloak, AND only the accounts listed in authorized_users are admitted --
  # any other valid NOMAD user gets HTTP 403 (reject_unauthorized_users defaults true).
  require_authentication: true
  authorized_users:
    # FAIL-SAFE FLOOR. The full group list is provided at deploy time via the env var
    # NOMAD_AUTH_AUTHORIZED_USERS in .env (a JSON array), which OVERRIDES this list.
    # This single entry only takes effect if that env var is unset -- so a missing
    # .env locks the Oasis down to the maintainer rather than failing OPEN to every
    # NOMAD account. Must be the maintainer's CENTRAL NOMAD account e-mail (the
    # nomad-lab.eu login), which may differ from their institutional address.
    # Recovery if locked out: fix the list / env var and
    # `docker compose restart app worker north logtransfer`.
    - dominik.demuth@tu-darmstadt.de


plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/crc270-hommage/nomad-oasis/jupyter:main

meta:
  deployment: "oasis"
  deployment_url: "https://samarium.trr270.tu-darmstadt.de/nomad-oasis/api"
  maintainer_email: "dominik.demuth@tu-darmstadt.de"
  description: "NOMAD Oasis for CRC/TRR 270 HoMMage"
  footer_links:
    - title: "CRC/TRR 270 HoMMage"
      url: "https://www.tu-darmstadt.de/sfb270"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  # FALSE because docker-compose.yaml's `north` runs the APP image with
  # `command: python -m nomad.cli admin run hub`. This flag and the hub image are a PAIR:
  #
  #   app image + `admin run hub`            -> enable_new_hub_api: false   <- what we ship
  #   ghcr.io/fairmat-nfdi/nomad-north:main  -> enable_new_hub_api: true    <- upstream default
  #
  # With true, the app uses app/v1/routers/north_new.py, whose start handler POSTs to
  # /hub/api/users/<user>/servers/<tool> with NO BODY. That is correct only for the dedicated
  # hub image, which resolves the tool itself by calling back into the NOMAD API
  # (/north/tools/<name>, /north/mounts/<name>) using the user's access token that
  # auth_state_hook copies into spawner.user_options. The app image's hub has no such
  # callback: its pre_spawn drives image, cmd, volume mounts and the GPU DeviceRequest
  # entirely from user_options['tool'], so a bodyless POST silently falls back to
  # DockerSpawner's stock jupyter/datascience-notebook, mounts nothing, requests no GPU.
  # The old router (north.py) builds that body explicitly, which is why false works here.
  #
  # [corrected 2026-08-05] An earlier version of this comment said the new hub API is simply
  # broken in nomad-lab 1.4.3. It is not -- it works with the dedicated image, verified end to
  # end on a pristine template. Only the MIXED pairs break. If north ever moves to the
  # dedicated image (samarium already has), flip this to true at the same time.
  #
  # NB: neither setting was the cause of the long-running "tool never starts" failure -- that
  # was KEYCLOAK_URL in .env.north missing its /auth suffix. See scripts/generate-env.sh.
  enable_new_hub_api: false
