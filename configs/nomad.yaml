services:
  api_host: "samarium.trr270.tu-darmstadt.de"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

auth:
  # Fully private Oasis. Every API request requires a valid login via the central
  # NOMAD Keycloak, AND only the accounts listed in authorized_users are admitted --
  # any other valid NOMAD user gets HTTP 403 (reject_unauthorized_users defaults true).
  require_authentication: true
  authorized_users:
    # FAIL-SAFE FLOOR. The full group list is provided at deploy time via the env var
    # NOMAD_AUTH_AUTHORIZED_USERS in .env (a JSON array), which OVERRIDES this list.
    # This single entry only takes effect if that env var is unset -- so a missing
    # .env locks the Oasis down to the maintainer rather than failing OPEN to every
    # NOMAD account. Must be the maintainer's CENTRAL NOMAD account e-mail (the
    # nomad-lab.eu login), which may differ from their institutional address.
    # Recovery if locked out: fix the list / env var and
    # `docker compose restart app worker north logtransfer`.
    - dominik.demuth@tu-darmstadt.de


plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/crc270-hommage/nomad-oasis/jupyter:main

meta:
  deployment: "oasis"
  deployment_url: "https://samarium.trr270.tu-darmstadt.de/nomad-oasis/api"
  maintainer_email: "dominik.demuth@tu-darmstadt.de"
  description: "NOMAD Oasis for CRC/TRR 270 HoMMage"
  footer_links:
    - title: "CRC/TRR 270 HoMMage"
      url: "https://www.tu-darmstadt.de/sfb270"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  # ⚠️ PAIRED WITH docker-compose.yaml's `north` image. Never change one without the other:
  #
  #   ghcr.io/fairmat-nfdi/nomad-north:main  -> true    <- what we ship, upstream default
  #   app image + `admin run hub`            -> false   <- the old shape, no longer used
  #
  # The flag selects which router the APP mounts, and the two route sets are DISJOINT:
  #   false -> /north/, /north/{name}
  #   true  -> /north/tools, /north/tools/{name}, /north/mounts/{name}, /north/servers
  #
  # With true the app's north_new.py POSTs to /hub/api/users/<user>/servers/<tool> with no
  # body, because the dedicated hub resolves the tool itself -- it calls back into the NOMAD
  # API using the user's access token, which auth_state_hook copies into spawner.user_options.
  # The old app-image hub has no such callback (its pre_spawn drives image, cmd, mounts and
  # the GPU DeviceRequest from user_options['tool']), so a bodyless POST would leave it with
  # nothing. Conversely, false starves the dedicated hub: /north/mounts/<tool> 404s, the hub
  # does not check the status, and it dies iterating the error body with
  # "TypeError: string indices must be integers" at jupyterhub_config.py:181.
  #
  # Verified end to end on samarium 2026-08-05 with the dedicated image: spawns
  # ghcr.io/crc270-hommage/nomad-oasis/jupyter:main, i.e. tool resolution honours the
  # entry-point override above. Check a live deployment without attempting a launch:
  #   curl -s <host>/nomad-oasis/api/v1/openapi.json | grep north/mounts
  #
  # NB: neither setting ever caused the long-running "tool never starts" failure -- that was
  # KEYCLOAK_URL in .env.north missing its /auth suffix. See scripts/generate-env.sh.
  enable_new_hub_api: true

# ⚠️ ENABLE TOGETHER WITH PHASE 5, NEVER BEFORE. See the GPU-NORTH deployment runbook, §1f and
# Phase 5 -- kept out of this public repo, since it describes live host topology.
#
# fs.*_external are the paths seen by the docker daemon that SPAWNS sessions, on ITS OWN
# host. The plain fs.staging / fs.public / fs.north_home stay as they are -- those are the
# paths inside the container and are unaffected by where the hub runs.
#
# TODAY the spawning daemon is samarium's own, so the derived defaults are correct and this
# block MUST stay commented out. NOMAD_FS_EXTERNAL_WORKING_DIRECTORY ("$PWD" =
# /var/nomad-oasis, see docker-compose.yaml) yields /var/nomad-oasis/.volumes/fs/... which
# exists here. Uncommenting now points the LOCAL hub at /srv/nomad-north/..., which does not
# exist on samarium -- docker then creates it as an empty directory and every session comes
# up showing ZERO uploads, with no error anywhere. It fails exactly like a broken mount.
#
# AFTER Phase 5 the spawning daemon is titan's (.102), and titan mounts samarium's exported
# /var/nomad-oasis/.volumes/fs at /srv/nomad-north/fs -- the bindfs view, from /etc/fstab
# (Phase 1e). Same bytes, different path. The app hands the daemon a STRING, so unless it is
# translated here every bind mount lands on an empty directory instead of the upload tree.
#
# Consumers, verified in nomad-lab: nomad/north/__init__.py:90,106 (the session mounts) and
# app/v1/routers/uploads.py:3309 (the informational upload_files_server_path field). Nothing
# reads or writes data through them. fs.actions_external is deliberately left deriving from
# $PWD -- Actions workers keep running on samarium.
#
# fs:
#   staging_external:    /srv/nomad-north/fs/staging
#   public_external:     /srv/nomad-north/fs/public
#   north_home_external: /srv/nomad-north/fs/north/users
